services:
  db:
    image: mysql:8.4
    container_name: agrolink-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/${GHCR_IMAGE_BASE:-prasanjeet-mandal/agrolink}/agrolink-backend:${GHCR_IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: agrolink-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REGISTRATION_EXPIRATION: ${JWT_REGISTRATION_EXPIRATION:-600000}
      OTP_EXPOSE_CODE: ${OTP_EXPOSE_CODE:-true}
      OTP_REQUIRE_VERIFY: ${OTP_REQUIRE_VERIFY:-true}
      OTP_DEV_CODE: ${OTP_DEV_CODE:-123456}
      OTP_MAX_SENDS: ${OTP_MAX_SENDS:-5}
      OTP_RATE_WINDOW_MINUTES: ${OTP_RATE_WINDOW_MINUTES:-60}
      OTP_RESEND_COOLDOWN: ${OTP_RESEND_COOLDOWN:-30}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@agrolink.in}
      MAILGUN_KEY: ${MAILGUN_KEY}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  optimization-service:
    image: ghcr.io/${GHCR_IMAGE_BASE:-prasanjeet-mandal/agrolink}/agrolink-optimization:${GHCR_IMAGE_TAG:-latest}
    build:
      context: ./optimization-service
    container_name: agrolink-optimization
    restart: unless-stopped
    ports:
      - "8001:8001"

  frontend:
    image: ghcr.io/${GHCR_IMAGE_BASE:-prasanjeet-mandal/agrolink}/agrolink-frontend:${GHCR_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: agrolink-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data: