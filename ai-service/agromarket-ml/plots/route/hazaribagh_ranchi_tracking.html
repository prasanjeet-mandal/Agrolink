
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>AgroMarket Delivery Tracking</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>


<!-- LEAFLET -->

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f5;
}

#map {
    width: 100vw;
    height: 100vh;
}


/* =====================================================
   CONTROL PANEL
   ===================================================== */

.panel {

    position: absolute;

    top: 20px;
    left: 20px;

    width: 330px;

    background: rgba(255,255,255,0.97);

    padding: 22px;

    border-radius: 18px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.20);

    z-index: 1000;
}


.title {

    font-size: 24px;

    font-weight: bold;

    margin-bottom: 6px;

    color: #1f2937;
}


.route-title {

    font-size: 14px;

    color: #6b7280;

    margin-bottom: 18px;
}


.info-box {

    background: #f5f7fa;

    padding: 14px;

    border-radius: 12px;

    margin-bottom: 15px;
}


.row {

    display: flex;

    justify-content: space-between;

    margin: 9px 0;

    font-size: 15px;
}


.label {

    color: #6b7280;
}


.value {

    font-weight: bold;

    color: #1f2937;
}


.status {

    color: #1976d2;

}


/* =====================================================
   PROGRESS
   ===================================================== */

.progress-label {

    display: flex;

    justify-content: space-between;

    margin-bottom: 7px;

    font-size: 14px;
}


.progress-container {

    width: 100%;

    height: 10px;

    background: #dfe5eb;

    border-radius: 10px;

    overflow: hidden;
}


#progressBar {

    height: 100%;

    width: 0%;

    background: #1976d2;

    border-radius: 10px;

    transition: width 0.15s linear;
}


/* =====================================================
   BUTTONS
   ===================================================== */

.buttons {

    display: flex;

    gap: 8px;

    margin-top: 18px;
}


button {

    flex: 1;

    border: none;

    padding: 12px 8px;

    border-radius: 10px;

    color: white;

    background: #1976d2;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;
}


button:hover {

    opacity: 0.88;
}


/* =====================================================
   LEGEND
   ===================================================== */

.legend {

    display: flex;

    justify-content: space-between;

    margin-top: 18px;

    font-size: 13px;

    color: #555;
}


.legend-item {

    display: flex;

    align-items: center;

    gap: 5px;
}


.legend-circle {

    width: 13px;

    height: 13px;

    border-radius: 50%;
}


.start-circle {

    background: #16a34a;
}


.delivery-circle {

    background: #ef4444;
}


.destination-circle {

    background: #dc2626;
}


/* =====================================================
   TRUCK / MOVING VEHICLE
   ONLY SMALL BLUE CIRCLE
   ===================================================== */

.vehicle-marker {

    width: 22px;

    height: 22px;

    border-radius: 50%;

    background: #1976d2;

    border: 3px solid white;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.35);

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px) {

    .panel {

        width: calc(100% - 30px);

        left: 15px;

        top: 15px;

        padding: 16px;
    }

    .title {

        font-size: 20px;
    }

}

</style>

</head>


<body>


<div id="map"></div>


<!-- =====================================================
     PANEL
     ===================================================== -->

<div class="panel">

    <div class="title">
        🌱 AgroMarket Delivery
    </div>

    <div class="route-title">
        Hazaribagh → Ramgarh → Ormanjhi → Ranchi
    </div>


    <div class="info-box">

        <div class="row">

            <span class="label">
                Status
            </span>

            <span
                class="value status"

                Ready
            </span>

        </div>


        <div class="row">

            <span class="label">
                Current
            </span>

            <span
                class="value"

                Hazaribagh
            </span>

        </div>


        <div class="row">

            <span class="label">
                Next Stop
            </span>

            <span
                class="value"

            </span>

        </div>


        <div class="row">

            <span class="label">
                Distance
            </span>

            <span
                class="value"
                id="distance">
                98.98 km
            </span>

        </div>


        <div class="row">

            <span class="label">
                ETA
            </span>

            <span
                class="value"

                86 min
            </span>

        </div>

    </div>


    <!-- PROGRESS -->

    <div class="progress-label">

        <span>
            Progress
        </span>

        <span id="progressText">
            0%
        </span>

    </div>


    <div class="progress-container">

        <div id="progressBar"></div>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button onclick="startAnimation()">
            ▶ Start
        </button>

        <button onclick="pauseAnimation()">
            ⏸ Pause
        </button>

        <button onclick="resetAnimation()">
            ↻ Reset

    </div>


    <!-- LEGEND -->

    <div class="legend">

        <div class="legend-item">

            <div
                class="legend-circle start-circle">
            </div>

            Start

        </div>


        <div class="legend-item">

            <div
                class="legend-circle delivery-circle">

            Delivery

        </div>


        <div class="legend-item">

            <div
                class="legend-circle destination-circle">
            </div>

            Destination

        </div>

    </div>

</div>

8], [23.344339, 85.310364], [23.344361, 85.310237], [23.34437, 85.310116], [23.344372, 85.309989], [23.344367, 85.309866], [23.344365, 85.309847], [23.344341, 85.309842], [23.344307, 85.309839], [23.343905, 85.309863], [23.343766, 85.309862], [23.343737, 85.309857], [23.343719, 85.309845], [23.343709, 85.309822], [23.343705, 85.309775], [23.343705, 85.309681], [23.343712, 85.309473]];


const stops =
    [{"name": "Hazaribagh", "lat": 23.99385, "lon": 85.3927, "type": "start"}, {"name": "Ramgarh", "lat": 23.63224, "lon": 85.51257, "type": "delivery"}, {"name": "Ormanjhi", "lat": 23.48345, "lon": 85.47606, "type": "delivery"}, {"name": "Ranchi", "lat": 23.34316, "lon": 85.3094, "type": "destination"}];


// ========================================================
// MAP
// ========================================================

const map = L.map("map");


L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors'

    }
).addTo(map);


// ========================================================
// ROUTE LINE
// ========================================================

const routeLine = L.polyline(

    routePoints,

    {

        color: "#1976d2",

        weight: 6,

        opacity: 0.9

    }

).addTo(map);


// Fit route

map.fitBounds(
    routeLine.getBounds(),
    {
        padding: [50, 50]
    }
);


// ========================================================
// STOP ICONS
// ========================================================

function createStopIcon(type) {

    let color = "#16a34a";
    let symbol = "●";

    if (type === "delivery") {

        color = "#ef4444";

        symbol = "📍";

    }

    if (type === "destination") {

        color = "#dc2626";

        symbol = "●";

    }

    return L.divIcon({

        className: "",

        html: `
            <div style="
                width: 32px;
                height: 32px;
                border-radius: 50%;
                background: white;
                border: 2px solid ${color};
                display:flex;
                align-items:center;
                justify-content:center;
                box-shadow:0 2px 8px rgba(0,0,0,0.3);
                font-size:15px;
            ">
                <span style="color:${color}">
                    ${symbol}
                </span>
            </div>
        `,

        iconSize: [32,32],

        iconAnchor: [16,16]

    });

}


// ========================================================
// ADD STOP MARKERS
// ========================================================

stops.forEach(stop => {

    const marker = L.marker(

        [stop.lat, stop.lon],

        {
            icon: createStopIcon(stop.type)
        }

    ).addTo(map);


    marker.bindTooltip(

        stop.name,

        {
            permanent: true,

            direction: "right",

            offset: [12, 0]
        }

    );

});


// ========================================================
// SMALL BLUE CIRCLE VEHICLE
// ========================================================

const vehicleIcon = L.divIcon({

    className: "",

    html: `
        <div class="vehicle-marker"></div>
    `,

    iconSize: [22,22],

    iconAnchor: [11,11]

});


const vehicleMarker = L.marker(

    routePoints[0],

    {
        icon: vehicleIcon,

        zIndexOffset: 1000
    }

).addTo(map);


// ========================================================
// ANIMATION VARIABLES
// ========================================================

let currentIndex = 0;

let animationRunning = false;

let animationId = null;


// ========================================================
// ANIMATION SPEED
// ========================================================

// Smaller = slower
// Bigger = faster

const SPEED = 0.8;


// ========================================================
// START
// ========================================================

function startAnimation() {

    if (animationRunning) {
        return;
    }

    animationRunning = true;

    document.getElementById("status")
        .innerText = "Moving";

    animate();

}


// ========================================================
// PAUSE
// ========================================================

function pauseAnimation() {

    animationRunning = false;

    document.getElementById("status")
        .innerText = "Paused";

    if (animationId) {

        cancelAnimationFrame(animationId);

        animationId = null;

    }

}


// ========================================================
// RESET
// ========================================================

function resetAnimation() {

    animationRunning = false;

    if (animationId) {

        cancelAnimationFrame(animationId);

        animationId = null;

    }

    currentIndex = 0;

    vehicleMarker.setLatLng(
        routePoints[0]
    );

    updateInformation();

    document.getElementById("status")
        .innerText = "Ready";

}


// ========================================================
// ANIMATION
// ========================================================

function animate() {

    if (!animationRunning) {
        return;
    }


    currentIndex += SPEED;


    if (currentIndex >= routePoints.length - 1) {

        currentIndex =
            routePoints.length - 1;

        vehicleMarker.setLatLng(
            routePoints[currentIndex]
        );

        animationRunning = false;

        document.getElementById("status")
            .innerText = "Delivered";

        updateInformation();

        return;
    }


    const index =
        Math.floor(currentIndex);


    const nextIndex =
        Math.min(
            index + 1,
            routePoints.length - 1
        );


    const point1 =
        routePoints[index];


    const point2 =
        routePoints[nextIndex];


    const fraction =
        currentIndex - index;


    const lat =
        point1[0] +
        (point2[0] - point1[0]) *
        fraction;


    const lon =
        point1[1] +
        (point2[1] - point1[1]) *
        fraction;


    vehicleMarker.setLatLng([
        lat,
        lon
    ]);


    // Follow vehicle

    map.panTo(
        [lat, lon],
        {
            animate: true,

            duration: 0.1
        }
    );


    updateInformation();


    animationId =
        requestAnimationFrame(
            animate
        );

}


// ========================================================
// INFORMATION UPDATE
// ========================================================

function updateInformation() {

    const progress =
        currentIndex /
        (routePoints.length - 1);


    const percentage =
        Math.min(
            100,
            Math.round(progress * 100)
        );


    document.getElementById(
        "progressBar"
    ).style.width =
        percentage + "%";


    document.getElementById(
        "progressText"
    ).innerText =
        percentage + "%";


    // Determine current stop

    let currentStop =
        stops[0];

    let nextStop =
        stops[1];


    if (percentage < 35) {

        currentStop = stops[0];

        nextStop = stops[1];

    }

    else if (percentage < 65) {

        currentStop = stops[1];

        nextStop = stops[2];

    }

    else if (percentage < 85) {

        currentStop = stops[2];

        nextStop = stops[3];

    }

    else {

        currentStop = stops[3];

        nextStop = null;

    }


    document.getElementById(
        "current"
    ).innerText =
        currentStop.name;


    document.getElementById(
        "nextStop"
    ).innerText =
        nextStop
            ? nextStop.name
            : "Delivered";


    const remaining =
        (1 - progress) *
        98.9769;


    document.getElementById(
        "distance"
    ).innerText =
        Math.max(
            0,
            remaining
        ).toFixed(2) + " km";


    const remainingMinutes =
        (1 - progress) *
        86.19;


    document.getElementById(
        "eta"
    ).innerText =
        Math.max(
            0,
            remainingMinutes
        ).toFixed(0) + " min";

}


// Initial information

updateInformation();

</script>
