            </b>

    <script>

    // =====================================================
    // AGROMARKET LIVE DELIVERY SIMULATION
    // =====================================================

    var vehicles = [{"vehicle": 2, "route": [{"city": "Ahmedabad", "lat": 23.0215374, "lon": 72.5800568}, {"city": "Surat", "lat": 21.2094892, "lon": 72.8317058}, {"city": "Mumbai", "lat": 19.054999, "lon": 72.8692035}, {"city": "Delhi", "lat": 28.6664535, "lon": 77.2169781}, {"city": "Ahmedabad", "lat": 23.0215374, "lon": 72.5800568}], "load": 160.0, "capacity": 200.0, "utilization": 80.0, "distance": 2379.4}];

    var map = map_262e6df2cb51ef932cf8d29a36949398;

    var vehicleMarkers = [];

    var vehicleIndex = 0;

    var segmentIndex = 0;

    var progress = 0;

    var animationSpeed = 0.002;


    // =====================================================
    // CREATE VEHICLE MARKER
    // =====================================================

    function createVehicleMarker(vehicle)
    {

        var firstPoint =
            vehicle.route[0];


        var truckIcon =
            L.divIcon({

                className:
                    "agromarket-truck",

                html:
                    '<div style="' +

                    'font-size:30px;' +

                    'background:white;' +

                    'border-radius:50%;' +

                    'width:46px;' +

                    'height:46px;' +

                    'text-align:center;' +

                    'line-height:46px;' +

                    'box-shadow:0 3px 10px rgba(0,0,0,0.35);' +

                    'border:2px solid #222;' +

                    '">' +

                    '🚚' +

                    '</div>',

                iconSize:
                    [46,46],

                iconAnchor:
                    [23,23]

            });


        var marker =
            L.marker(

                [
                    firstPoint.lat,
                    firstPoint.lon
                ],

                {
                    icon:
                        truckIcon,

                    zIndexOffset:
                        1000

                }

            ).addTo(map);


        marker.bindPopup(

            "<b>🚚 Vehicle " +
            vehicle.vehicle +
            "</b><br><br>" +

            "Load: " +
            vehicle.load +
            " kg<br>" +

            "Capacity: " +
            vehicle.capacity +
            " kg<br>" +

            "Utilization: " +
            vehicle.utilization +
            "%<br>" +

            "Route Distance: " +
            vehicle.distance +
            " km"

        );


        return marker;

    }


    // =====================================================
    // CREATE ALL VEHICLES
    // =====================================================

    for(
        var i = 0;
        i < vehicles.length;
        i++
    )
    {

        vehicleMarkers.push(

            createVehicleMarker(
                vehicles[i]
            )

        );

    }


    // =====================================================
    // DISTANCE BETWEEN TWO POINTS
    // =====================================================

    function distance(
        lat1,
        lon1,
        lat2,
        lon2
    )
    {

        var dLat =
            lat2 - lat1;

        var dLon =
            lon2 - lon1;

        return Math.sqrt(
            dLat*dLat +
            dLon*dLon
        );

    }


    // =====================================================
    // MOVE VEHICLE
    // =====================================================

    function moveVehicles()
    {

        if(
            vehicles.length === 0
        )
        {
            return;
        }


        for(
            var v = 0;
            v < vehicles.length;
            v++
        )
        {

            var vehicle =
                vehicles[v];


            var marker =
                vehicleMarkers[v];


            var route =
                vehicle.route;


            if(
                route.length < 2
            )
            {
                continue;
            }


            var currentSegment =
                segmentIndex %
                (route.length - 1);


            var start =
                route[currentSegment];


            var end =
                route[currentSegment + 1];


            // ---------------------------------------------
            // INTERPOLATION
            // ---------------------------------------------

            var lat =
                start.lat +
                (
                    end.lat -
                    start.lat
                ) *
                progress;


            var lon =
                start.lon +
                (
                    end.lon -
                    start.lon
                ) *
                progress;


            marker.setLatLng(
                [lat, lon]
            );


            // ---------------------------------------------
            // UPDATE PANEL
            // ---------------------------------------------

            if(v === 0)
            {

                document.getElementById(
                    "vehicle-name"
                ).innerHTML =
                    "Vehicle " +
                    vehicle.vehicle;


                document.getElementById(
                    "vehicle-location"
                ).innerHTML =
                    start.city;


                document.getElementById(
                    "vehicle-next"
                ).innerHTML =
                    end.city;


                document.getElementById(
                    "vehicle-status"
                ).innerHTML =
                    "🚚 En Route";

            }

        }


        // ---------------------------------------------
        // INCREASE POSITION
        // ---------------------------------------------

        progress += animationSpeed;


        if(
            progress >= 1
        )
        {

            progress = 0;

            segmentIndex++;


            // -----------------------------------------
            // ROUTE COMPLETE
            // -----------------------------------------

            if(
                segmentIndex >=
                vehicles[0].route.length - 1
            )
            {

                segmentIndex = 0;

                document.getElementById(
                    "vehicle-status"
                ).innerHTML =
                    "🔄 Route Restarting";

            }

        }

    }


    // =====================================================
    // START LIVE TRACKING
    // =====================================================

    setInterval(
        moveVehicles,
        100
    );


    </script>
