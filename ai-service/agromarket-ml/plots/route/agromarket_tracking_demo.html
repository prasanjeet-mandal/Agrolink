
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>AgroMarket Live Delivery</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
}

/* TOP LEFT */

.logo {
    position: fixed;
    top: 15px;
    left: 15px;

    z-index: 1000;

    background: white;

    padding: 12px 18px;

    border-radius: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.25);
}

.logo-title {
    font-size: 20px;
    font-weight: bold;
}

.logo-subtitle {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
}

/* RIGHT PANEL */

.panel {
    position: fixed;

    top: 15px;
    right: 15px;

    z-index: 1000;

    width: 260px;

    background: white;

    padding: 18px;

    border-radius: 14px;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.25);
}

.panel-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.row {
    margin-top: 9px;
    font-size: 14px;
}

.value {
    font-weight: bold;
}

/* BOTTOM BUTTONS */

.controls {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 1000;

    background: white;

    padding: 12px;

    border-radius: 12px;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.25);
}

button {
    border: none;

    padding: 10px 16px;

    margin: 3px;

    border-radius: 8px;

    cursor: pointer;

    background: #222;

    color: white;

    font-weight: bold;
}

button:hover {
    opacity: 0.8;
}

/* TRUCK */

.truck {
    width: 48px;
    height: 48px;

    background: white;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 30px;

    border: 2px solid #222;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.35);
}

</style>

</head>


<body>


<div id="map"></div>


<!-- LOGO -->

<div class="logo">

    <div class="logo-title">
        🚚 AgroMarket
    </div>

    <div class="logo-subtitle">
        Live Delivery Tracking
    </div>

</div>


<!-- TRACKING PANEL -->

<div class="panel">

    <div class="panel-title">
        🚚 Delivery Tracking
    </div>

    <div class="row">
        Vehicle:
        <span class="value">
            AgroTruck-01
        </span>
    </div>

    <div class="row">
        Status:
        <span
            class="value"
            id="status">
            Starting
        </span>
    </div>

    <div class="row">
        From:
        <span class="value">
            Kochi
        </span>
    </div>

    <div class="row">
        To:
        <span class="value">
            Mumbai
        </span>
    </div>

    <div class="row">
        Progress:
        <span
            class="value"
            id="progress">
            0%
        </span>
    </div>

    <div class="row">
        Current:
        <span
            class="value"
            id="current">
            Kochi
        </span>
    </div>

</div>


<!-- CONTROLS -->

<div class="controls">

    <button onclick="startTracking()">
        ▶ Start
    </button>

    <button onclick="pauseTracking()">
        ⏸ Pause
    </button>

    <button onclick="resetTracking()">
        ↻ Reset
    </button>

</div>


<script>


// =========================================================
// ROUTE
// =========================================================

const route = [[9.9312, 76.2673], [10.1632, 76.6413], [11.0168, 76.9558], [11.341, 77.7172], [12.9716, 77.5946], [13.3409, 77.5682], [15.3173, 75.7139], [17.385, 78.4867], [18.5204, 73.8567], [18.9, 73.5], [19.076, 72.8777]];


// =========================================================
// MAP
// =========================================================

const map = L.map("map");


L.tileLayer(

    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap contributors"

    }

).addTo(map);


// =========================================================
// INDIA BOUNDS
// =========================================================

const indiaBounds = L.latLngBounds(

    [6.5, 68.0],

    [37.5, 97.5]

);

map.setMaxBounds(indiaBounds);


// =========================================================
// ROUTE LINE
// =========================================================

const routeLine = L.polyline(

    route,

    {

        color: "#1976d2",

        weight: 6,

        opacity: 0.8

    }

).addTo(map);


map.fitBounds(

    routeLine.getBounds(),

    {

        padding: [80, 80]

    }

);


// =========================================================
// START MARKER
// =========================================================

const startIcon = L.divIcon(

    {

        className: "",

        html:
            '<div style="' +
            'background:#16a34a;' +
            'color:white;' +
            'width:38px;' +
            'height:38px;' +
            'border-radius:50%;' +
            'display:flex;' +
            'align-items:center;' +
            'justify-content:center;' +
            'font-weight:bold;' +
            'font-size:18px;' +
            'border:3px solid white;' +
            '">A</div>',

        iconSize: [38, 38],

        iconAnchor: [19, 19]

    }

);


L.marker(

    route[0],

    {
        icon: startIcon
    }

)
.addTo(map)
.bindPopup(
    "<b>🟢 START</b><br>Kochi"
);


// =========================================================
// END MARKER
// =========================================================

const endIcon = L.divIcon(

    {

        className: "",

        html:
            '<div style="' +
            'background:#dc2626;' +
            'color:white;' +
            'width:38px;' +
            'height:38px;' +
            'border-radius:50%;' +
            'display:flex;' +
            'align-items:center;' +
            'justify-content:center;' +
            'font-weight:bold;' +
            'font-size:18px;' +
            'border:3px solid white;' +
            '">B</div>',

        iconSize: [38, 38],

        iconAnchor: [19, 19]

    }

);


L.marker(

    route[route.length - 1],

    {
        icon: endIcon
    }

)
.addTo(map)
.bindPopup(
    "<b>🔴 DESTINATION</b><br>Mumbai"
);


// =========================================================
// TRUCK
// =========================================================

const truckIcon = L.divIcon(

    {

        className: "",

        html:
            '<div class="truck">🚚</div>',

        iconSize: [48, 48],

        iconAnchor: [24, 24]

    }

);


const truck = L.marker(

    route[0],

    {

        icon: truckIcon,

        zIndexOffset: 1000

    }

).addTo(map);


// =========================================================
// VARIABLES
// =========================================================

let segment = 0;

let progress = 0;

let running = false;

let animationId = null;


// =========================================================
// START
// =========================================================

function startTracking()
{

    if (running)
        return;

    running = true;

    document.getElementById(
        "status"
    ).innerText =
        "🚚 On the way";

    animate();

}


// =========================================================
// PAUSE
// =========================================================

function pauseTracking()
{

    running = false;

    document.getElementById(
        "status"
    ).innerText =
        "⏸ Paused";

    if (animationId)
    {
        cancelAnimationFrame(
            animationId
        );
    }

}


// =========================================================
// RESET
// =========================================================

function resetTracking()
{

    running = false;

    segment = 0;

    progress = 0;

    truck.setLatLng(
        route[0]
    );

    document.getElementById(
        "status"
    ).innerText =
        "Starting";

    document.getElementById(
        "progress"
    ).innerText =
        "0%";

    document.getElementById(
        "current"
    ).innerText =
        "Kochi";

    map.fitBounds(
        routeLine.getBounds()
    );

}


// =========================================================
// ANIMATION
// =========================================================

function animate()
{

    if (!running)
        return;


    // ---------------------------------------------
    // FINISHED
    // ---------------------------------------------

    if (
        segment >=
        route.length - 1
    )
    {

        running = false;

        truck.setLatLng(
            route[
                route.length - 1
            ]
        );

        document.getElementById(
            "status"
        ).innerText =
            "✅ Delivered";

        document.getElementById(
            "progress"
        ).innerText =
            "100%";

        document.getElementById(
            "current"
        ).innerText =
            "Mumbai";

        return;
    }


    const start =
        route[segment];


    const end =
        route[segment + 1];


    // ---------------------------------------------
    // MOVE
    // ---------------------------------------------

    progress += 0.003;


    if (progress >= 1)
    {

        progress = 0;

        segment++;

    }


    const lat =
        start[0] +
        (
            end[0] -
            start[0]
        ) *
        progress;


    const lon =
        start[1] +
        (
            end[1] -
            start[1]
        ) *
        progress;


    truck.setLatLng(
        [lat, lon]
    );


    // ---------------------------------------------
    // PROGRESS
    // ---------------------------------------------

    const totalSegments =
        route.length - 1;


    const currentProgress =
        (
            (
                segment +
                progress
            )
            /
            totalSegments
        )
        * 100;


    document.getElementById(
        "progress"
    ).innerText =
        Math.round(
            currentProgress
        ) + "%";


    document.getElementById(
        "current"
    ).innerText =
        segment === 0
            ? "Kochi"
            : segment < 4
                ? "On Route"
                : segment < 7
                    ? "Central India"
                    : "Mumbai";


    // ---------------------------------------------
    // FOLLOW TRUCK
    // ---------------------------------------------

    map.panTo(

        [lat, lon],

        {
            animate: false
        }

    );


    animationId =
        requestAnimationFrame(
            animate
        );

}


</script>

</body>

</html>
