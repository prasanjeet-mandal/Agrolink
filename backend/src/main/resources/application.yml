# Local development configuration with H2 in-memory database
spring:
  datasource:
    url: jdbc:h2:mem:agrolink_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # Allow binding to all interfaces for development
  server:
    port: 8080

# Security
jwt:
  secret: local-dev-secret-key-change-in-production-min-256-bits
  expiration: 86400000 # 24 hours

# Logging
logging:
  level:
    com.agrolink: DEBUG
    org.springframework.security: DEBUG