name: AgroLink CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "ai-service/**"
      - "optimization-service/**"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend, ai-service, optimization-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        if: matrix.service == 'backend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Python
        if: matrix.service == 'ai-service'
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Frontend - install & build
        if: matrix.service == 'frontend'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend - run tests & package
        if: matrix.service == 'backend'
        working-directory: backend
        run: mvn -B clean verify

      - name: AI service - install & check
        if: matrix.service == 'ai-service'
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          python -c "import app.main"

      - name: Optimization service - install & check
        if: matrix.service == 'optimization-service'
        working-directory: optimization-service
        run: |
          pip install -r requirements.txt
          python -c "import app.main"

  docker:
    name: Build & Push Images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: ./frontend
            image: agrolink-frontend
          - context: ./backend
            image: agrolink-backend
          - context: ./ai-service
            image: agrolink-ai
          - context: ./optimization-service
            image: agrolink-optimization
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to Server
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f